<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="onboardingTitle">Welcome to TapTranslate</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="onboarding">
    <header class="brand"><img src="icons/icon128.png" alt="" /><strong>TapTranslate</strong></header>
    <h1 data-i18n="onboardingSimpleTitle">Connect a translation service</h1>
    <p class="intro hint" data-i18n="onboardingSimpleHint">Choose a service, add your key, and start reading.</p>
    <form id="onboardingForm">
      <fieldset id="connectionFields" disabled>
        <legend class="sr-only" data-i18n="onboardingSimpleTitle">Connect a translation service</legend>
        <div class="field">
          <label id="providerPresetLabel" data-i18n="simpleService">Service</label>
          <div id="providerPicker" class="provider-picker" role="group" aria-labelledby="providerPresetLabel"></div>
          <p id="providerPresetHint" class="hint" hidden></p>
        </div>
        <div class="field"><label for="apiKey" data-i18n="apiKey">API key</label><input type="password" id="apiKey" autocomplete="off" placeholder="sk-..." /></div>
        <div class="field"><label for="model" data-i18n="model">Model</label><input type="text" id="model" required maxlength="200" /></div>
        <details id="connectionOptions">
          <summary data-i18n="connectionOptions">Connection options</summary>
          <div class="field"><label for="connectionMode" data-i18n="connectionMode">Connection route</label><select id="connectionMode"><option value="direct" data-i18n="directApi">Direct API</option><option value="proxy" data-i18n="connectionModeProxy">Custom proxy</option></select></div>
          <div class="field"><label for="apiBase" data-i18n="apiBaseUrl">API base URL</label><input type="url" id="apiBase" required /></div>
        </details>
        <label class="inline-check remember"><input type="checkbox" id="rememberKey" checked /><span data-i18n="rememberApiKey">Remember API key on this device</span></label>
        <p class="hint" data-i18n="rememberApiKeyHint">Uncheck to keep the key only for this browser session.</p>
        <p class="hint privacy" data-i18n="privacyTextDestination">Visible page text is sent only to the API endpoint you configure.</p>
        <div class="actions"><button type="button" id="testBtn" class="btn-secondary" data-i18n="testConnection">Test connection</button><button type="submit" id="finishBtn" class="btn-primary" data-i18n="onboardingSaveStart">Save and start</button></div>
      </fieldset>
      <p id="testStatus" class="test-status" role="status" aria-live="polite"></p>
    </form>
    <a href="options.html" id="openSettings" data-i18n="openSettings">Settings</a>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
